<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A whiteboard in the browser: draw, add text, undo, autosave and export to PNG.">
    <title>Interactive White Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-fluid">
    <div class="row m-2 m-md-5">
        <div id="white-board" class="col-md-9">
            <canvas id="drawing-layer" aria-hidden="true"></canvas>
            <div id="text-layer"></div>
        </div>
        <div id="control-panel" class="col-md-3">
            <div id="undo-redo-buttons" class="mb-3">
                <button id="undo-btn" type="button" class="btn btn-secondary btn-undo-redo">Undo</button>
                <button id="redo-btn" type="button" class="btn btn-secondary btn-undo-redo">Redo</button>
            </div>

            <div id="tools" class="button-grid mb-3" role="group" aria-label="Tools">
                <button type="button" class="btn btn-outline-primary btn-sm tool-btn" data-tool="select">Select</button>
                <button type="button" class="btn btn-outline-primary btn-sm tool-btn" data-tool="pen">Pen</button>
                <button type="button" class="btn btn-outline-primary btn-sm tool-btn" data-tool="eraser">Eraser</button>
                <button type="button" class="btn btn-outline-primary btn-sm tool-btn" data-tool="line">Line</button>
                <button type="button" class="btn btn-outline-primary btn-sm tool-btn" data-tool="rectangle">Rectangle</button>
                <button type="button" class="btn btn-outline-primary btn-sm tool-btn" data-tool="ellipse">Ellipse</button>
            </div>

            <label for="color-input" class="control-label">Color:</label>
            <input type="color" id="color-input" value="#000000" class="form-control custom-range">

            <label for="brush-size" class="control-label">Brush Size:</label>
            <input type="range" id="brush-size" min="1" max="30" step="1" value="4" class="form-range mb-2">

            <button id="add-text-btn" type="button" class="btn btn-primary">Add Text</button>
            <p id="edit-hint" class="small text-muted">Double-click a text box to edit it.</p>

            <label for="font-size" class="control-label">Font Size:</label>
            <div class="input-group mb-3">
                <input type="number" id="font-size" min="10" max="50" step="1" value="20" class="form-control">
                <span class="input-group-text">px</span>
            </div>

            <div class="button-grid mb-3">
                <button id="front-btn" type="button" class="btn btn-outline-secondary btn-sm">To Front</button>
                <button id="delete-btn" type="button" class="btn btn-outline-danger btn-sm">Delete</button>
                <button id="clear-btn" type="button" class="btn btn-outline-danger btn-sm">Clear</button>
            </div>

            <div class="button-grid">
                <button id="export-png-btn" type="button" class="btn btn-outline-success btn-sm">Save PNG</button>
                <button id="export-json-btn" type="button" class="btn btn-outline-success btn-sm">Save JSON</button>
                <button id="import-json-btn" type="button" class="btn btn-outline-success btn-sm">Open JSON</button>
            </div>
            <input type="file" id="import-input" accept="application/json,.json" hidden>
            <p id="status" class="small text-muted mt-2 mb-0" role="status"></p>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
